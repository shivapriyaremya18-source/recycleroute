<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f3"><title>RecycleRoute | Know before you go</title>
<style>
:root{--ink:#fff;--green:#176b4c;--paper:#18251e;--muted:#edf3ef;--line:#ffffff55;--accent:#baf2c3}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#18251e;color:var(--ink);font-family:Georgia,"Times New Roman",serif}.page{position:relative;isolation:isolate;min-height:100%;display:flex;flex-direction:column;padding:28px clamp(18px,5vw,72px) 30px}.page:before,.page:after{content:"";position:fixed;inset:-6%;pointer-events:none}.page:before{z-index:-2;background:url("intro.png") center/cover no-repeat;transform-origin:center;animation:scene-zoom 1.25s cubic-bezier(.18,.72,.22,1) both}.page:after{z-index:-1;inset:0;background:linear-gradient(180deg,#07130f75 0%,#07130f34 45%,#07130f72 100%)}@keyframes scene-zoom{0%{transform:scale(.24) rotate(-28deg);filter:brightness(.32)}72%{transform:scale(1.06) rotate(3deg);filter:brightness(.9)}100%{transform:scale(1) rotate(0deg);filter:brightness(1)}}.masthead{display:flex;align-items:center;gap:12px;font:800 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.2px}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--green);color:#fff;border-radius:12px}.mark svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.center{flex:1;display:grid;place-items:center;min-height:320px}.stage{position:relative;width:min(100%,1280px);min-height:230px;display:grid;place-items:center;overflow:visible}.line{color:#fff;text-shadow:0 2px 22px #000b;position:relative;z-index:1;margin:0;text-align:center;white-space:nowrap;font-family:Georgia,"Times New Roman",serif;font-size:clamp(.72rem,3.25vw,2.8rem);font-weight:600;line-height:1.22;letter-spacing:-.035em}.word{display:inline-block;filter:blur(4.5px);opacity:.34;will-change:filter,opacity;transition:none}.word:not(:last-child){margin-right:.23em}.focus-frame{position:absolute;z-index:2;left:0;top:0;width:0;height:0;border:1px solid var(--accent);border-radius:2px;box-shadow:0 0 0 1px #33845f16,0 0 20px #33845f40, inset 0 0 14px #33845f12;pointer-events:none;will-change:transform,width,height}.focus-frame:before,.focus-frame:after{content:"";position:absolute;width:12px;height:12px;border-color:#d8ffdc;border-style:solid}.focus-frame:before{left:-1px;top:-1px;border-width:2px 0 0 2px}.focus-frame:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}.enter{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}.focus-control{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--green);padding:12px 15px;font:700 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.focus-control:hover{background:#edf7ef}.focus-control:focus-visible{outline:3px solid #91caaa;outline-offset:3px}.enter a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--green);color:#fff;border-radius:12px;padding:13px 18px;font:750 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 7px 20px #176b4c22;transition:transform .18s ease,background .18s ease}.enter a:hover{background:#124d38;transform:translateY(-2px)}.enter a:focus-visible{outline:3px solid #91caaa;outline-offset:3px}.transition{position:fixed;inset:0;z-index:20;background:var(--green);opacity:0;pointer-events:none;transition:opacity .45s ease}.transition.active{opacity:1}.arrow{font-size:18px}.note{text-align:center;color:var(--muted);font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;margin:12px 0 0}.foot{display:flex;justify-content:space-between;gap:20px;color:#75837a;font:11px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.foot span:last-child{text-align:right}@media(max-width:600px){.page{padding:18px 14px 18px}.center{min-height:270px}.stage{min-height:180px}.line{font-size:clamp(.69rem,3.1vw,1.05rem);letter-spacing:-.045em}.word:not(:last-child){margin-right:.14em}.foot{font-size:10px}}@media(prefers-reduced-motion:reduce){.transition{transition:none}html{scroll-behavior:auto}.enter a{transition:none}}
</style></head>
<body><div class="page"><header class="masthead"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.2 5.2A8 8 0 0 1 19 9"/><path d="M18.4 5.7 19.2 9l-3.4.3"/><path d="M16.8 18.8A8 8 0 0 1 5 15"/><path d="M5.6 18.3 4.8 15l3.4-.3"/><path d="M5 9.2a8 8 0 0 1 2.2-4"/><path d="M19 14.8a8 8 0 0 1-2.2 4"/></svg></span><span>RecycleRoute</span></header>
<main class="center"><div class="stage" id="stage"><h1 class="line" id="line" aria-label="Know before you go: verified drop-offs, every time"><span class="word">Know</span><span class="word">before</span><span class="word">you</span><span class="word">go:</span><span class="word">verified</span><span class="word">drop-offs,</span><span class="word">every</span><span class="word">time</span></h1><div class="focus-frame" id="frame" aria-hidden="true"></div></div></main>
<div class="enter"><button class="focus-control" id="focusControl" type="button">Replay tagline focus</button><a id="enterLink" href="recycleroute-redesigned.html">Enter RecycleRoute <span class="arrow" aria-hidden="true">&#8594;</span></a></div><p class="note">Check what is accepted before making the trip.</p><footer class="foot"><span>Local recycling research prototype</span><span>Confirm materials and drop-off details directly.</span></footer></div><div class="transition" id="transition" aria-hidden="true"></div>
<script>(()=>{const stage=document.getElementById('stage'),frame=document.getElementById('frame'),words=[...document.querySelectorAll('.word')],reduce=window.matchMedia('(prefers-reduced-motion: reduce)'),control=document.getElementById('focusControl');let x=0,y=0,w=0,h=0,index=0,hold=0,started=false,running=false;const ease=.14;function paintSharp(){words.forEach(el=>{el.style.filter='none';el.style.opacity='1'});frame.style.display='none'}function boxes(){const sr=stage.getBoundingClientRect();return words.map(el=>{const r=el.getBoundingClientRect();return{x:r.left-sr.left,y:r.top-sr.top,width:r.width,height:r.height}})}function tick(){const rects=boxes();if(!rects.length){requestAnimationFrame(tick);return}const target=rects[index];if(!started){w=target.width;h=target.height;x=(stage.clientWidth-w)/2;y=(stage.clientHeight-h)/2;started=true}const dx=target.x-x,dy=target.y-y,targetW=target.width+Math.abs(dx)*.55;x+=dx*ease;y+=dy*ease;w+=(targetW-w)*ease;h+=(target.height-h)*ease;frame.style.transform=`translate3d(${x}px,${y}px,0)`;frame.style.width=`${w}px`;frame.style.height=`${h}px`;rects.forEach((r,i)=>{const overlap=Math.max(0,Math.min(r.x+r.width,x+w)-Math.max(r.x,x));const fraction=r.width?overlap/r.width:0;const sharp=Math.min(1,fraction*1.5);words[i].style.filter=`blur(${(1-sharp)*4.5}px)`;words[i].style.opacity=String(.34+sharp*.66)});if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(target.width-w)<1&&Math.abs(target.height-h)<1){hold++;if(hold>=40){index=(index+1)%words.length;hold=0}}else hold=0;requestAnimationFrame(tick)}function startFocus(force){frame.style.display='block';words.forEach(el=>{el.style.filter='blur(4.5px)';el.style.opacity='.34'});index=0;hold=0;started=false;if(!running){running=true;requestAnimationFrame(tick)}}control.addEventListener('click',()=>{if(reduce.matches){startFocus(true)}else{startFocus(true)}});startFocus(false);window.addEventListener('resize',()=>{if(running&&started){requestAnimationFrame(()=>{const r=words[index].getBoundingClientRect(),sr=stage.getBoundingClientRect();x=r.left-sr.left;y=r.top-sr.top;w=r.width;h=r.height})}});const enter=document.getElementById('enterLink'),veil=document.getElementById('transition');enter.addEventListener('click',e=>{if(reduce.matches)return;e.preventDefault();veil.classList.add('active');setTimeout(()=>location.href=enter.href,450)})})();</script></body></html>
